name: Tool feedback
description: Tell us what would make one of these AI dev tools more useful.
title: "[feedback]: "
labels: ["feedback"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Context Scout AI
        - Lab hub
        - Other
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What were you trying to do?
      description: Describe the workflow, repo, or agent setup.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What was missing or confusing?
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Where did you find this?
      placeholder: GitHub, X, Reddit, Hacker News, search, friend, etc.

